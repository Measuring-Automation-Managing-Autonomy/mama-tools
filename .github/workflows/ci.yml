name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --quiet -e .[dev]
      - name: Run tests
        run: python -m pytest -q

  examples:
    name: Examples validate against bundled schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -e .
      - name: Validate example use-case record
        run: mama-tools usecase validate examples/usecase-refunds-agent.yaml
      - name: Example metric calculation matches worked arithmetic
        run: |
          out=$(mama-tools metric calc exception-rate examples/metric-inputs.json)
          echo "$out" | grep -q '"value": 4.1'
